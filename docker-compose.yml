services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: collabdocs
      POSTGRES_USER: collabdocs
      POSTGRES_PASSWORD: collabdocs
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabdocs -d collabdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DJANGO_SECRET_KEY: replace-with-a-long-random-secret
      DJANGO_DEBUG: "True"
      POSTGRES_DB: collabdocs
      POSTGRES_USER: collabdocs
      POSTGRES_PASSWORD: collabdocs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: "*"
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
